<style>
/* Düzen: dikey tek ekran. Üstte bölüm ve sayaçlar, ortada çapraz bulmaca, altta harf çarkı.
   Palet İznik çinisinden: kobalt, turkuaz, nar kırmızısı. */
:root {
  --bg: #F1F4F9;
  --surface: #FFFFFF;
  --ink: #13233D;
  --muted: #566882;
  --line: #D3DBE7;
  --tile: #DEE5F0;
  --tile-line: #C7D1E2;
  --accent: #1E4FC0;
  --on-accent: #FFFFFF;
  --found: #0B7F7B;
  --on-found: #FFFFFF;
  --warm: #D9462E;
  --on-warm: #FFFFFF;
  --shadow: 0 8px 28px rgba(19, 35, 61, .13);
  --f-display: 'Fredoka', 'HC Inter', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --f-ui: 'Rubik', 'HC Inter', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1524; --surface: #142238; --ink: #E9EFFA; --muted: #98A8C2; --line: #25364F;
    --tile: #1B2D47; --tile-line: #2B4062; --accent: #7CA3FF; --on-accent: #0B1524;
    --found: #33C7BE; --on-found: #05302D; --warm: #FF8A73; --on-warm: #3A0F07;
    --shadow: 0 8px 28px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1524; --surface: #142238; --ink: #E9EFFA; --muted: #98A8C2; --line: #25364F;
  --tile: #1B2D47; --tile-line: #2B4062; --accent: #7CA3FF; --on-accent: #0B1524;
  --found: #33C7BE; --on-found: #05302D; --warm: #FF8A73; --on-warm: #3A0F07;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45); color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; width: 100%; overflow: hidden; overscroll-behavior: none; touch-action: pan-y; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  overflow: hidden; overscroll-behavior: none; touch-action: pan-y; position: fixed; inset: 0; width: 100%;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app {
  height: 100%;
  max-width: 460px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Üst çubuk */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lvl {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 14px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.donebtns { display: flex; gap: 8px; width: 100%; } .donebtns .btn, .donebtns .btn.ghost { margin: 0; } #nextBtn { flex: 1.5 1 0; min-width: 0; } #doneHome { flex: 1 1 0; min-width: 0; }
.lvl.ord { flex-direction: row-reverse; justify-content: flex-end; }
.lvl small { font: 500 11px/1 var(--f-ui); letter-spacing: .14em; color: var(--muted); }
.lvl b { font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font: 500 14px/1 var(--f-ui);
}
.chip b { font: 600 15px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: .7em; text-align: center; }
.chip svg { width: 16px; height: 16px; flex: none; color: var(--warm); }
button.chip { cursor: pointer; }
.chip.empty { opacity: .55; }
.menubtn { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.menubtn svg { width: 22px; height: 22px; }
.top { justify-content: flex-start; }
.top .chips { margin-left: auto; }
.lvl { cursor: default; padding: 6px 12px; }
@media (max-width: 420px) { .chip span { display: none; } .chip { padding: 0 10px; } }
.shake { animation: shake .35s; }

/* Kelime ilerleme çubuğu: her kelime bir parça */
.prog { display: flex; gap: 4px; }
.seg { flex: 1; height: 6px; border-radius: 3px; background: var(--tile); transition: background .3s; }
.seg.on { background: var(--found); }

/* Bulmaca */
.board { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 0; }
#grid {
  display: grid;
  --gap: 4px;
  grid-template-columns: repeat(var(--cols, 1), var(--cell, 40px));
  grid-template-rows: repeat(var(--rows, 1), var(--cell, 40px));
  gap: var(--gap);
  animation: gridIn .35s ease-out;
}
.cell {
  border-radius: calc(var(--cell, 40px) * .2);
  background: var(--tile);
  box-shadow: inset 0 0 0 1.5px var(--tile-line);
  display: grid; place-items: center;
  font: 600 calc(var(--cell, 40px) * .56)/1 var(--f-display);
  color: var(--on-found);
  user-select: none; -webkit-user-select: none;
}
.cell { position: relative; }
.bomb { position: absolute; inset: 10%; display: grid; place-items: center; pointer-events: none; animation: bombWob 1.2s ease-in-out infinite; transform-origin: 50% 70%; }
.bomb svg { width: 100%; height: 100%; overflow: visible; }
.bomb .spark { animation: spark .3s steps(2) infinite; transform-box: fill-box; transform-origin: center; }
.bomb.boom { animation: boom .8s ease-out forwards; z-index: 3; }
.cell.blast { animation: blast .8s ease-out; }
@keyframes bombWob { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg) scale(1.06); } }
@keyframes spark { 0% { transform: scale(1); } 100% { transform: scale(1.6); opacity: .7; } }
@keyframes boom { 0% { transform: scale(1); filter: none; } 35% { transform: scale(2.8); filter: brightness(3) saturate(2); } 100% { transform: scale(4.2); opacity: 0; } }
@keyframes blast { 0% { background: #ff9d00; } 100% { background: var(--tile); } }
.cell.on { background: var(--found); box-shadow: none; }
.cell.pop { animation: pop .42s cubic-bezier(.2, 1.4, .4, 1) both; }
.cell.flash { animation: flash .6s ease-in-out; }

/* Yazılan kelime */
.stage { height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.pill {
  min-height: 40px; padding: 7px 18px; border-radius: 999px;
  background: var(--accent); color: var(--on-accent);
  font: 600 22px/1 var(--f-display); letter-spacing: .1em;
  visibility: hidden; transition: background .15s;
}
.pill.show { visibility: visible; }
.pill.ok { background: var(--found); color: var(--on-found); }
.pill.bonus { background: var(--warm); color: var(--on-warm); }
.pill.dup { background: var(--ink); color: var(--bg); }
.pill.bad { background: var(--warm); color: var(--on-warm); animation: shake .35s; }
.cap { height: 40px; font-size: 14px; line-height: 19px; color: var(--muted); text-align: center; overflow: hidden; padding: 0 14px; display: flex; align-items: center; justify-content: center; }
.cap > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cap.mean { color: var(--ink); }
.cap.mean b { color: var(--accent); font-weight: 600; margin-right: 4px; }

/* Harf çarkı */
.wheel-wrap { display: flex; justify-content: center; padding-bottom: 6px; }
.wheel {
  position: relative;
  width: min(100%, 330px, 40vh);
  width: min(100%, 330px, 40svh);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow), inset 0 0 0 1.5px var(--line);
  touch-action: none;

// Bölüm üretici: sözlükten harf havuzu seçer, çapraz bulmacayı yerleştirir.
// Aynı tohum her zaman aynı bölümü verir; farklı tohum farklı bölüm.
function makeGenerator(dict, cats, extraStr, scores) {
  scores = scores || {};
  const SC = w => scores[w] || 3;
  const GEN = dict.split(' ').filter(Boolean);
  const GENSET = new Set(GEN);
  // Kategori kelimeleri: genel sözlükte olmayanlar yalnızca geçerli (bonus) kelime sayılır,
  // sıradan bölümlerde bulmacaya konmaz.
  const CATS = (cats || []).map(c => ({ name: c.name, words: c.words, set: new Set(c.words) }));
  const catOnly = new Set();
  const extra = [];
  for (const c of CATS) for (const w of c.words) if (!GENSET.has(w) && !catOnly.has(w)) { catOnly.add(w); extra.push(w); }
  const WORDS = GEN.concat(extra);
  // Yalnızca bonus (geçerli kelime) olarak kabul edilen geniş liste; bulmacaya girmez.
  const XW = (extraStr || '').split(' ').filter(w => w && !GENSET.has(w) && !catOnly.has(w));
  const LET = 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ';
  const maskOf = w => { let m = 0; for (const ch of w) m |= 1 << LET.indexOf(ch); return m; };
  const WMASK = WORDS.map(maskOf);
  const XMASK = XW.map(maskOf);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function counts(w) {
    const m = new Map();
    for (const ch of w) m.set(ch, (m.get(ch) || 0) + 1);
    return m;
  }
  function formable(w, pool) {
    const c = counts(w);
    for (const [ch, n] of c) if ((pool.get(ch) || 0) < n) return false;
    return true;
  }

  // Zor harfler: bunlar bulmacada ve kelime havuzunda öne çıkar.
  const HARD = new Set([...'ĞŞVÜÖÇJFHZ']);
  const SPECIAL_LETTERS = new Set([...'ĞŞVÜÖÇ']);
  // Mastar (-mak/-mek) biçimleri bulmacaya konmaz; bonus olarak geçerli kalır. Fiilimsiler (-ma/-me) serbest.
  const NOUN_OK = new Set(('AMA DAMA ELMA EMEK EKMEK IRMAK HAMAK HURMA MAMA TEMA YAMA FİRMA KELİME DÜĞME LOKMA SİNEMA PLAZMA FORMA ÇEŞME DOLMA SARMA SEMA KARMA ' +
    'DONDURMA PASTIRMA KAYMAK MERCİMEK SUMAK KAZMA İVME MALZEME DÖŞEME KABARTMA GÖZLEME KAVURMA OYMA YEMEK').split(' '));
  const isVerbal = w => /(MAK|MEK)$/.test(w) && !NOUN_OK.has(w);

  const baseCache = new Map(), candCache = new Map();
  function baseCands(root) {
    let c = baseCache.get(root);
    if (!c) {
      const pool = counts(root), rm = maskOf(root), L = root.length;
      c = [];
      for (let i = 0; i < WORDS.length; i++) {
        if ((WMASK[i] & ~rm) !== 0) continue;
        const w = WORDS[i];
        if (w.length < 3 || w.length > L) continue;
        if (formable(w, pool)) c.push(w);
      }
      baseCache.set(root, c);
    }
    return c;
  }
  function candsOf(root) {
    let c = candCache.get(root);
    if (!c) {
      c = baseCands(root).slice();
      const pool = counts(root), rm = maskOf(root), L = root.length;
      for (let i = 0; i < XW.length; i++) {
        if ((XMASK[i] & ~rm) !== 0) continue;
        const w = XW[i];
        if (w.length > L) continue;
        if (formable(w, pool)) c.push(w);
      }
      candCache.set(root, c);
    }
    return c;
  }

  const gridCache = new Map();
  function gridCandsOf(root) {
    let c = gridCache.get(root);
    if (!c) { c = baseCands(root).filter(w => !catOnly.has(w) && !isVerbal(w)); gridCache.set(root, c); }
    return c;
  }
  const ROOTS8 = [];
  const ROOTS = { 4: [], 5: [], 6: [], 7: [] };
  const SPECIAL = { 4: [], 5: [], 6: [], 7: [] };
  const NORMAL = { 4: [], 5: [], 6: [], 7: [] }; // zor harf içermeyen kökler

  let ready = false;
  function init() {

    const seen = new Set();
    for (const w of GEN) {
      if (w.length < 4 || w.length > 7) continue;
      const s = [...w].sort().join('');
      if (seen.has(s)) continue;
      seen.add(s);
      const has = [...new Set([...w].filter(ch => SPECIAL_LETTERS.has(ch)))];
      // Zor harfli kökler için eşik biraz düşük: bu harflerle çeşit çıkarmak zor.
      if (gridCandsOf(w).length >= (w.length === 4 ? 5 : has.length ? 6 : 7)) {

        if (has.length) SPECIAL[w.length].push(w); else NORMAL[w.length].push(w);
        for (const ch of has) (BY_LETTER[ch] = BY_LETTER[ch] || { 4: [], 5: [], 6: [], 7: [] })[w.length].push(w);
      }
    }
    const seen8 = new Set();
    for (const w of GEN) {
      if (w.length !== 8) continue;
      const s8 = [...w].sort().join('');
      if (seen8.has(s8)) continue;
      seen8.add(s8);
      const g = gridCandsOf(w);
      if (g.length >= 8 && g.some(x => x.length === 7) && g.some(x => x.length === 8)) ROOTS8.push(w);

  // Bu harflerle 5 harfli kelime kurulamadığında 4 harfli havuz da kullanılır.
  function pickRoot(rng) {
    const r = rng();
    let k = r < .12 ? 4 : r < .42 ? 5 : r < .77 ? 6 : 7;
    let list = NORMAL[k].length ? NORMAL[k] : ROOTS[k];
    if (rng() < .53) {
      // Zor harflerden birini seç (Ğ, Ş, V, Ü, Ö, Ç eşit şansla), sonra o harfi taşıyan bir kök.
      const letters = Object.keys(BY_LETTER);
      const ch = letters[Math.floor(rng() * letters.length)];
      list = BY_LETTER[ch][k];
      if (!list.length) list = [].concat(BY_LETTER[ch][4], BY_LETTER[ch][5], BY_LETTER[ch][6], BY_LETTER[ch][7]);

    return list[Math.floor(rng() * list.length)];
  }

  function tryBuild(cands, anchor, target, maxW, maxH, rng, opts) {
    opts = opts || {};

    const key = (r, c) => r + ',' + c;

    function put(w, r, c, d) {
      const dr = d ? 1 : 0, dc = d ? 0 : 1;
      for (let i = 0; i < w.length; i++) {
        const k = key(r + dr * i, c + dc * i);
        const e = grid.get(k) || { ch: w[i], h: false, v: false };
        if (d === 0) e.h = true; else e.v = true;
        grid.set(k, e);
      }
      placed.push({ w, r, c, d });
      minR = Math.min(minR, r); maxR = Math.max(maxR, r + dr * (w.length - 1));

function layout() {

function layoutWheel() {
  const n = letters.length, size = wheelEl.clientWidth;
  const f = n <= 4 ? .25 : n === 5 ? .22 : n === 6 ? .2 : n === 7 ? .185 : .165;
  Lpx = size * f;
  const r = size / 2 - Lpx / 2 - size * .045;
  wheelEl.style.setProperty('--L', Lpx + 'px');
  wheelEl.style.setProperty('--tw', (Lpx * .2) + 'px');
  trailSvg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
  const slots = letters.map((_, i) => {
    const a = i / n * 2 * Math.PI - Math.PI / 2;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };

  elemPos = letters.map((_, k) => slots[perm[k]]);
  letters.forEach((l, k) => {
    l.el.style.setProperty('--x', elemPos[k].x + 'px');

function localXY(e) {

  return { x: e.clientX - r.left - r.width / 2, y: e.clientY - r.top - r.height / 2 };
}

}

function submit() {
  const word = sel.map(k => letters[k].ch).join('');
  const order = sel.slice();
  sel = []; pointer = null;
  letters.forEach(l => l.el.classList.remove('sel'));
  drawTrail();
  if (word.length < 2) { hidePill(); return; }
  evaluate(word, order);
}

function evaluate(word, order) {
  if (word.length < cur.m) { result(word, 'bad', 'En az ' + cur.m + ' harf gerekli'); sfx.bad(); buzz([30, 40, 30]); return; }
  moves++;
  const wd = wordIndex.get(word);
  if (wd) {
    if (bomb && wd.cells.includes(bomb.k)) { explode(word); return; }
    if (isDone(wd)) { dartTick(null); persist(); result(word, 'dup', voice('d')); sfx.dup(); flash(wd); return; }
    let n = 0;
    wd.cells.forEach((k, i) => { if (!filled.has(k)) { filled.add(k); flyTo(k, order[i], n++); } });
    const mn = MEAN[word];
    result(word, 'ok', mn ? mn.charAt(0).toLocaleUpperCase('tr-TR') + mn.slice(1) : voice('f'), mn ? 5000 : 0, !!mn);
    sfx.ok(); buzz(18);
    comboN++;
    foundWord(word, false);
    if (word.length >= 7 && comboN < 3) hype('long', word.length); else if (comboN >= 2) hype('combo', comboN); else if (Math.random() < .4) hype('flavor');
    dartTick(wd);
    afterFill();
    return;
  }
  dartTick(null); persist();
  if (bonusAll.has(word) && word.length < 4) { result(word, 'dup', ''); sfx.dup(); return; }
  if (bonusAll.has(word)) {
    if (bonusSet.has(word)) { result(word, 'dup', voice('d')); sfx.dup(); return; }
    bonusSet.add(word);
    let msg = 'Bonus kelime!', gotHint = false;
    comboN++;
    if (mode !== 'daily') {
      S.pts++;
      if (S.pts % 3 === 0) { S.hints++; msg += ' +1 ipucu kazandın'; gotHint = true; }
      else msg += ' İpucuna ' + (S.pts % 3) + '/3';
    }
    if (catSetCur && catSetCur.has(word)) msg = 'Kategori kelimesi! +10 sn';
    result(word, 'bonus', msg);
    sfx.bonus(); buzz(18);
    foundWord(word, true);
    if (gotHint) hype('hint'); else if (catSetCur && catSetCur.has(word)) hype('cat'); else if (comboN >= 2) hype('combo', comboN);
    updateHeader(); persist();
    return;
  }
  wrongs++; comboN = 0; persist();
  result(word, 'bad', voice('w')); sfx.bad(); buzz([30, 40, 30]);
}

}

  const src = letters[li] && letters[li].el;

  const a = src.getBoundingClientRect(), b = c.el.getBoundingClientRect();
  if (!a.width || !b.width) { fillCell(k, n * 70); return; }
  const f = document.createElement('div');
  f.className = 'fly'; f.textContent = c.ch;
  f.style.left = a.left + 'px'; f.style.top = a.top + 'px';
  f.style.width = a.width + 'px'; f.style.height = a.height + 'px';
  f.style.fontSize = (a.width * .62) + 'px';
  document.body.appendChild(f);
  const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
  const an = f.animate(
    [{ transform: 'translate(0,0) scale(1)' }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + (b.width / a.width) + ')' }],
    { duration: 380, delay: n * 70, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'both' });
  an.onfinish = () => { f.remove(); fillCell(k, 0); };
}

// Yıldız (5 üzerinden): zorluk çarpanı d >= 0,8; ceza = (2*ipucu + 0,5*hatalı deneme) / kelime sayısı / d.
// d: ortalama kelime uzunluğu, kelime sayısı ve nadir kelime oranı arttıkça büyür (zor bulmaca = daha toleranslı).
function difficulty(ws) {
  const n = Math.max(1, ws.length), avg = ws.reduce((s, x) => s + x.w.length, 0) / n;
  const rare = ws.filter(x => (WSC[x.w] || 3) < 4).length / n;
  const d = 1 + (avg - 4.5) * 0.12 + (n - 6) * 0.04 + rare * 0.3 - 0.15;
  return Math.min(1.6, Math.max(0.7, 1 + (d - 1) * 2));
}

  w = Math.max(1, w | 0); d = d || 1;

  return e <= 0.12 ? 5 : e <= 0.35 ? 4 : e <= 0.7 ? 3 : e <= 1.3 ? 2 : 1;
};

function ringHTML(t) {
  if (!t.bg) return '';
  const tier = t.tier, n = t.ringN || (tier <= 1 ? 8 : tier === 2 ? 10 : tier === 3 ? 12 : 14), spd = t.ringT || (70 - tier * 8);
  const [x0, y0, vw, vh] = t.gl.vb.split(' ').map(Number), sc = 100 / Math.max(vw, vh), c0 = t.c[0], c1 = t.c[1];
  const glyph = '<svg viewBox="' + t.gl.vb + '">' + t.gl.s + '</svg>';
  const place = (cnt, R, sz, extra) => { let h = ''; for (let i = 0; i < cnt; i++) { const a = i / cnt * Math.PI * 2; h += '<b class="wg" style="left:' + (50 + R * Math.cos(a)).toFixed(2) + '%;top:' + (50 + R * Math.sin(a)).toFixed(2) + '%;width:' + sz + '%;--t:' + spd + 's' + (extra || '') + '">' + glyph + '</b>'; } return h; };
  let h = '<i class="wr" style="--t:' + spd + 's"><svg viewBox="0 0 100 100" class="wt"><circle cx="50" cy="50" r="47" fill="none" stroke="' + c0 + '" stroke-opacity=".55" stroke-width=".7" stroke-dasharray="' + (tier >= 3 ? '1 2.2' : '5 3') + '"/></svg>' + place(n, 47, 8.5) + '</i>';
  h += '<i class="wr rev" style="--t:' + (spd * 1.4).toFixed(0) + 's"><svg viewBox="0 0 100 100" class="wt"><circle cx="50" cy="50" r="52.5" fill="none" stroke="' + c1 + '" stroke-opacity=".4" stroke-width=".5" stroke-dasharray="0.8 3.4" stroke-linecap="round"/></svg>';
  const dots = tier >= 3 ? 16 : 10; for (let i = 0; i < dots; i++) { const a = i / dots * Math.PI * 2 + .2; h += '<u class="wd' + (i % 2 ? ' b' : '') + '" style="left:' + (50 + 52.5 * Math.cos(a)).toFixed(2) + '%;top:' + (50 + 52.5 * Math.sin(a)).toFixed(2) + '%;background:' + (i % 2 ? c1 : c0) + ';--t:' + (2 + (i % 5) * .6) + 's;--d:' + (-i * .37).toFixed(2) + 's"></u>'; }

function startLevel(i, keep) {

function onSolved() {

}

function solveLevel() {
  S.done = true;
  const first = !S.doneLv.includes(S.lv);
  const dif = difficulty(words), st = starsFor(hintsUsed, wrongs, words.length, dif); lastRun = { h: hintsUsed, w: wrongs, d: dif };
  if (first) { S.doneLv.push(S.lv); S.hints++; }
  S.stars[S.lv] = Math.max(S.stars[S.lv] || 0, st);
  if (isGateLevel(S.lv) && S.unlocked <= S.lv) S.gate = { lv: S.lv };
  else S.unlocked = Math.max(S.unlocked, Math.min(S.lv + 1, N - 1));
  touchStreak(); persist(); updateHeader(); checkBadges();
  doneTimer = setTimeout(() => showLevelDone(first, st), 900);
}

function giveUp() {
  if (mode !== 'level' || S.done) return;
  for (const x of words) for (const k of x.cells) { const c = cellMap.get(k); if (c && !filled.has(k)) { filled.add(k); c.el.textContent = c.ch; c.el.classList.add('on'); } }
  S.filled = [...filled]; updateProgress();
  S.done = true; finished = true;
  const first = !S.doneLv.includes(S.lv);
  if (first) S.doneLv.push(S.lv);
  S.stars[S.lv] = S.stars[S.lv] || 0;
  lastRun = { h: hintsUsed, w: wrongs, d: difficulty(words) };
  if (isGateLevel(S.lv) && S.unlocked <= S.lv) S.gate = { lv: S.lv };

}

const catArt = (name, size) => '<svg viewBox="0 0 48 48" width="' + size + '" height="' + size + '" aria-hidden="true">' + (CAT_ART[name] || '') + '</svg>';
function buildSpinWheel() {
  const g = $('spinG'), n = catNames.length, step = 360 / n, R = 100;
  const fills = ['accent', 'found', 'warm'];
  const pt = (deg, r) => [(r * Math.sin(deg * Math.PI / 180)).toFixed(2), (-r * Math.cos(deg * Math.PI / 180)).toFixed(2)];
  let svg = '';
  for (let i = 0; i < n; i++) {
    const a0 = i * step, a1 = (i + 1) * step, mid = a0 + step / 2;
    const p0 = pt(a0, R), p1 = pt(a1, R), f = fills[i % 3] === 'accent' && i === n - 1 && n % 3 === 1 ? 'tile' : fills[i % 3];
    svg += '<path d="M0,0 L' + p0.join(',') + ' A' + R + ',' + R + ' 0 0 1 ' + p1.join(',') + ' Z" fill="var(--' + f + ')" stroke="var(--surface)" stroke-width="2"/>';

    const right = mid < 180;
    const tr = right ? 'rotate(' + (mid - 90) + ') translate(52,0)' : 'rotate(' + (mid + 90) + ') translate(-52,0)';
    svg += '<text transform="' + tr + '" text-anchor="' + (right ? 'end' : 'start') + '" dominant-baseline="central" fill="' + on + '" font-size="9.5" font-weight="600">' + catNames[i] + '</text>';

function exportProgress() {
  const data = JSON.stringify({ app: 'harf-carki', v: 1, saved: new Date().toISOString(), data: S });
  const name = 'harf-carki-yedek-' + new Date().toISOString().slice(0, 10) + '.json';

  try { if (window.AndroidBridge && AndroidBridge.saveFile) { AndroidBridge.saveFile(name, data); msg('Yedek kaydediliyor: ' + name); return; } } catch (e) { /* uygulama köprüsü yok */ }
  try {
    if (window.claude && claude.use) {
      claude.use('downloads').then(dls => {
        if (!dls) { legacy(); return; }
        dls.save({ filename: name, data }).then(() => msg('Yedek kaydedildi: ' + name), er => { if (!er || er.code !== 'declined') msg('Dosya kaydedilemedi'); });
      }, legacy);
      return;
    }
  } catch (e) { /* yedek yolu */ }
  legacy();
  function legacy() {
  try {
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      navigator.share({ files: [file], title: 'Harf Çarkı yedeği' }).then(() => msg('Yedek paylaşıldı'), () => dl());
      return;
    }
  } catch (e) { /* paylaşım yok */ }
  dl();
  }
  function dl() {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
      msg('Yedek dosyası indirildi: ' + name);
    } catch (e) { msg('Dosya kaydedilemedi'); }
  }
}
function readImport(file) {

  const r = new FileReader();
  r.onload = () => {
    let o = null;
    try { const j = JSON.parse(String(r.result)); o = j && j.app === 'harf-carki' ? j.data : null; } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || !Number.isInteger(o.lv) || !Array.isArray(o.doneLv)) { msg('Bu dosya geçerli bir Harf Çarkı yedeği değil'); return; }
    pendingImport = o;
    $('setMsg1').innerHTML = (o.lv + 1) + '. bulmaca · ' + o.doneLv.length + ' bulmaca tamam. Mevcut ilerleme bununla değişecek. <span class="btnrow"><button type="button" class="btn sm" data-a="doimport">Yükle</button><button type="button" class="btn ghost sm" data-a="cancelimport">Vazgeç</button></span>';
  };
  r.onerror = () => msg('Dosya okunamadı');
  r.readAsText(file);
}
